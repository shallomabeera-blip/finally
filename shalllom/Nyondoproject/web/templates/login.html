<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - NYONDO Hardware</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #013220; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 8px; width: 360px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        .brand { text-align: center; font-size: 20px; font-weight: bold; color: #013220;; margin-bottom: 5px; }
        .subtitle { text-align: center; font-size: 13px; color: #013220;; margin-bottom: 25px; }
        .field { margin-bottom: 16px; }
        .field label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; color: #013220; }
        .field input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        .field input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.1); }
        .field input.error-border { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18); }
        .field input.error-border:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.28); }
        .btn-submit { width: 100%; padding: 12px; background: #013220;; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #013220;; }
        .alert { padding: 10px; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; border-radius: 4px; font-size: 13px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">Nyondo General Hardware</div>
        <div class="subtitle">Digitized Management Registry System</div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="field">
                <label> Username:</label>
                <input type="text" name="username" value="{{ username_input }}" autocomplete="off" class="{% if 'username' in error_fields %}error-border{% endif %}">
            </div>
            <div class="field">
                <label>Password:</label>
                <input type="password" name="password" class="{% if 'password' in error_fields %}error-border{% endif %}">
            </div>
            <button type="submit" class="btn-submit"> Log In</button>
        </form>
    </div>
</body>
</html>
