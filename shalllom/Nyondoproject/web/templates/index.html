<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyondo General Hardware</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            
        }

        body{
            line-height: 1.6;
        }
        

        /* NAVBAR */
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #013220;
            padding: 15px 40px;
            color: white;
        }

        .navbar h1{
            font-size: 22px;
        }

        .navbar a{
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .navbar a:hover{
            text-decoration: underline;
        }

        
        .hero{
            height: 90vh;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
            url('https://images.unsplash.com/photo-1581092918056-0c4c3acd3789') center/cover;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero h2{
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p{
            font-size: 18px;
            max-width: 600px;
        }

        .btn{
            margin-top: 20px;
            padding: 12px 25px;
            background: #013220;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover{
            background: #013220;
        }

        
        .services{
            padding: 50px;
            text-align: center;
        }

        .services h2{
            margin-bottom: 30px;
        }

        .service-boxes{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .box{
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .box h3{
            margin-bottom: 10px;
            color: #013220;
        }

        /* FOOTER */
        .footer{
            background: #013220;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }

    </style>
</head>

<body>

   
    <div class="navbar">
        <h1>Nyondo General Hardware</h1>
        
    </div>

    
    <section class="hero">
        <h2>Building Your Dreams with Quality Hardware</h2>
        <p>
            Nyondo General Hardware provides quality building materials, tools, plumbing,
            electrical supplies and more at affordable prices.
        </p>
        <a href="{% url 'login' %}" class="btn">Login</a>
   
    </section>

    
    <div class="footer">
        <p>&copy; 2026 Nyondo General Hardware. All Rights Reserved.</p>
    </div>

</body>
</html>
